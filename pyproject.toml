[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otgate"
version = "0.1.1"
description = "OT-aware authorization gateway between an LLM agent and an industrial OPC UA server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ali K." }]
keywords = ["opc-ua", "mcp", "llm", "ot-security", "industrial", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # Pinned below 2.0: mcp 2.x renamed FastMCP to MCPServer and moved
    # mcp.server.fastmcp, which otgate/server.py still imports. Without this
    # cap a fresh install pulls 2.x and fails at import. Migration tracked in
    # the roadmap; until then the cap is what keeps `pip install` working.
    "mcp>=1.2.0,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real OPC UA backend. Not needed for FakeBackend, tests or the demo.
opcua = ["asyncua>=1.0"]
# Recorded-history rate checks (policy key `history_rate`): otgate asks a
# historian how fast a tag has actually been moving. Optional because the
# check is opt-in per tag and most deployments start without a historian.
# Until ottrend reaches PyPI, CI installs it from
# git+https://github.com/alikup-ai/ottrend — a direct URL cannot live in
# published metadata, so this entry names the release it expects.
history = ["ottrend>=0.1.0"]
# Development / testing. httpx powers Starlette's TestClient for the HTTP tests.
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
otgate = "otgate.server:main"
otgate-http = "otgate.server:main_http"

[project.urls]
Homepage = "https://github.com/alikup-ai/otgate"
Repository = "https://github.com/alikup-ai/otgate"
Issues = "https://github.com/alikup-ai/otgate/issues"
Changelog = "https://github.com/alikup-ai/otgate/commits/main"

[tool.hatch.build.targets.wheel]
packages = ["otgate"]

# Explicit allow-list rather than "everything git does not ignore": a stray
# virtualenv in the working tree once put 19 MB into a 50 KB package, and an
# allow-list cannot be broken that way by something nobody remembered to ignore.
[tool.hatch.build.targets.sdist]
include = [
    "otgate/",
    "tests/",
    "examples/",
    "docs/",
    "assets/demo.gif",
    "assets/demo.svg",
    "assets/make_demo_gif.py",
    "assets/make_demo_svg.py",
    "README.md",
    "README.ru.md",
    "LICENSE",
    "server.json",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pin the fixture loop scope explicitly: pytest-asyncio >=1.0 warns when it is
# unset and will change the default in a future release.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Make the repo root and the tests dir importable so tests can `import otgate`
# and `import conftest` regardless of the working directory.
pythonpath = [".", "tests"]
markers = [
    "integration: end-to-end tests against a real asyncua OPC UA server (needs the 'asyncua' extra)",
    "history: the recorded-history rate check driven by real ottrend (needs the 'history' extra)",
    "asi02: evidence for OWASP ASI02 (Tool Misuse & Exploitation) — see docs/threat-model.md",
]
