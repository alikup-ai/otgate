name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run against current dependency releases. otgate pins mcp<2, but
  # everything else floats, so a scheduled build is what turns "a dependency
  # released a breaking major" from an invisible problem into a red build.
  # Without this, mcp 2.0 broke the install for months and CI never noticed.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  # Unit tests: no OPC UA dependency. This is the promise that the whole policy
  # engine, approval flow, audit and fail-closed behaviour run on FakeBackend
  # with nothing external installed.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev only, no asyncua)
        run: pip install -e ".[dev]"
      - name: Run unit tests (excluding integration)
        run: pytest -m "not integration" -q

  # The recorded-history rate check against real ottrend. Separate from the unit
  # job because it needs a historian stack, and separate from integration
  # because it needs no OPC UA server: ottrend's MemoryTrend is its reference
  # semantics, so the check can be driven end to end in memory.
  #
  # ottrend is installed from git until it is on PyPI. A direct URL cannot live
  # in published package metadata, so the `history` extra names the release and
  # CI pins the source.
  history:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev + ottrend from git)
        run: |
          pip install -e ".[dev]"
          pip install "ottrend @ git+https://github.com/alikup-ai/ottrend@main"
      - name: Run the recorded-history rate checks
        run: pytest -m history -q

  # Integration tests: exercise otgate against a real asyncua OPC UA server.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with the opcua extra)
        run: pip install -e ".[dev,opcua]"
      - name: Run integration tests (real OPC UA)
        run: pytest -m integration -q
